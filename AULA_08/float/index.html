<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Float</title>
        <link rel="stylesheet" type="text/css" href="style.css"
    </head>
    <body>
        <h2>Float</h2>
        <p>Serve para mudar a posição do elemento na tela, seguindo seu ancestral mais próximo.</p>
        <ul>
            <li>Float: left; -> flutua para esquerda</li>
            <li>Float: right; -> flutua para direita</li>
            <li>Float: both; -> limpa os estilos anteriores</li>
        </ul>

        <br><br>

        <div>
            <h3>Float: left</h3>  
            <p class="esquerda">Um texto....</p> 
            <img src="https://d17sdk5u5lcsfg.cloudfront.net/media/images/45b0d923-416e-4434-820c-18192e3c61ab.jpg" >   
        </div>

         <div>
            <h3>Float: right</h3>  
            <p class="direita">Um texto....</p> 
            <img class="direita" src="https://d17sdk5u5lcsfg.cloudfront.net/media/images/45b0d923-416e-4434-820c-18192e3c61ab.jpg" >   
        </div>

        <p class="limpar">Um texto qualquer!</p>
    </body>
</html>
